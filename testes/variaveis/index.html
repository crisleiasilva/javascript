<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variáveis</title>
  <style>
    body {
      background-color: rgb(236, 101, 128);
      color:rgb(5, 88, 243);

  </style>

<body>
  <h1>Vamos trabalhar com variáveis</h1>

  <script>
    let nome = prompt("Qual seu nome?")

  </script>
</body>
</html>
