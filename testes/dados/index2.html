<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formatando String</title>
</head>
<body>
  <h1>Vamos praticar!</h1>

  <script>
    let nome = prompt("Digite seu nome: ");
    document.write(`Olá, seu nome tem ${nome.length} <br>`);
    document.write(`Seu nome em maiúsculas fica assim: ${nome.toUpperCase()} <br>`);
    document.write(`Seu nome em letras minúsculas fica assim: ${nome.toLowerCase()}`)

    //Formatando números

    document.write(`O valor de n1 é ${n1}`)*/
  </script>
</body>
</html>
